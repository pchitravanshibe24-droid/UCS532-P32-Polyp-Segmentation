name: Reproduce P32 benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reproduce.yml'
      - 'configs/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'run_all.sh'
      - 'app.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '4'
      GRADIO_ANALYTICS_ENABLED: 'False'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded CPU dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test code and smoke pipeline
        run: |
          python -m pytest -q
          bash run_all.sh --smoke
      - name: Reproduce held-out benchmark
        run: |
          set -o pipefail
          mkdir -p outputs
          bash run_all.sh 2>&1 | tee outputs/hosted-reproduction.log
      - name: Compare with reference results
        run: |
          set -o pipefail
          python -m scripts.check_reproduction results/tables/main_table.csv outputs/kvasir/tables/main_table.csv | tee outputs/hosted-comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p32-reproduction-evidence
          path: |
            outputs/hosted-*.log
            outputs/kvasir/splits/split_metadata.json
            outputs/kvasir/tables/*.csv
          if-no-files-found: ignore
